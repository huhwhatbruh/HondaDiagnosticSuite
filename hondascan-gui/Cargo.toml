[package]
name = "hondascan-gui"
version = "0.1.1"
description = "Native desktop front end for hondascan (Honda diagnostics)"
default-run = "hondascan-gui"
edition = "2021"
rust-version = "1.92"   # eframe / egui 0.35

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
egui-phosphor = "0.13"

# `cargo run` (debug) drew the turntable at a few frames a second: egui and the PNG decoder unoptimised. Dependencies are built
# optimised even in debug, our own code lightly, so a debug run is smooth too (a clean debug build is slower, once).
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"   # no unwinding tables: smaller, harder to read
opt-level = 3
debug = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(hondascan_packaged)"] }
