[package]
name = "hondascan-gui"
version = "0.6.1"
description = "Native desktop front end for hondascan (Honda diagnostics), Qt / QML"
default-run = "hondascan-gui"
license = "GPL-3.0-or-later"
edition = "2021"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"   # a panic must not unwind through Qt's C++ frames; also no unwinding tables: smaller
opt-level = 3
debug = false

[profile.dev]
debug = "line-tables-only"   # backtraces keep file:line; less to write and link

[profile.dev.package."*"]
debug = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(hondascan_packaged)"] }
