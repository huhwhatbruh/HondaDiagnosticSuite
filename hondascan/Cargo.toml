[package]
name = "hondascan"
version = "0.3.0"
description = "Honda diagnostics on Linux, using data decoded from HDS 3.105.12"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.92"

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
serde = "1"
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
flate2 = "1"
regex = "1"
libloading = "0.8"
csv = "1.4.0"
chacha20poly1305 = "0.11.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Devices_Communication", "Win32_System_Console", "Win32_System_IO", "Win32_System_Time"] }
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
debug = 0

[profile.dev.package."*"]
opt-level = 3
