[package]
name = "hondascan"
version = "0.1.1"
description = "Honda diagnostics on Linux, using data decoded from HDS 3.105.12"
edition = "2021"
rust-version = "1.92"

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
serde = "1"
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
libc = "0.2"
flate2 = "1"
regex = "1"
libloading = "0.8"
csv = "1.4.0"
chacha20poly1305 = "0.11.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
debug = 0

[profile.dev.package."*"]
opt-level = 3
